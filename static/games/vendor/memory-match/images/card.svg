<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0" y="0" width="144" height="108" viewBox="0 0 144 108">
  <!--
    Pasons face-down card art (2026-10-14 glass pass): frosted liquid-glass
    tile in the platform design language (tokens.css glass recipe), gold
    hairline rim, embossed deep-green question monogram. Replaces the
    upstream orange gradient tile. Full-bleed on purpose: the card's
    border-radius in MemoryGame.css clips the tile. See CHANGES.md.
  -->
  <defs>
    <linearGradient id="mmGlass" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="72" y2="108">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#F1EADB" stop-opacity="0.82"/>
    </linearGradient>
    <radialGradient id="mmSheen" cx="0.3" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mmRim" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="72" y2="108">
      <stop offset="0" stop-color="#C2A24B" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#C2A24B" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- frosted glass body -->
  <rect x="0" y="0" width="144" height="108" fill="url(#mmGlass)"/>
  <rect x="0" y="0" width="144" height="108" fill="url(#mmSheen)"/>

  <!-- gold hairline rim + bright top edge (light catching the material) -->
  <rect x="1.25" y="1.25" width="141.5" height="105.5" fill="none" stroke="url(#mmRim)" stroke-width="2.5"/>
  <path d="M16 1.6 H128" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.6" stroke-linecap="round"/>

  <!-- question monogram: white emboss under deep-green ink -->
  <g transform="translate(-216, -360)">
