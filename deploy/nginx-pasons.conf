# Pasons Smart QR - nginx site.
# Installed to /etc/nginx/sites-available/pasons by deploy/deploy.sh.
#
# nginx serves the two static trees itself and forwards everything else to
# gunicorn on 127.0.0.1:8001. Because nginx owns /media/, the app must not
# also serve it: keep SERVE_MEDIA=0 in .env.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Panel PDF uploads are capped at 20 MB in the app; leave a little room.
    client_max_body_size 25m;

    access_log /var/log/nginx/pasons.access.log;
    error_log  /var/log/nginx/pasons.error.log warn;

    # Never hand out dotfiles (.env, .git, editor backups) if one ever lands
    # beside the code or inside an upload folder.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location /static/ {
        alias /srv/pasons/platform/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        alias /srv/pasons/platform/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
