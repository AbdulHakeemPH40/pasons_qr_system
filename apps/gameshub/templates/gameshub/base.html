{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#31452D">
  <title>{% block title %}Games Hub{% endblock %}</title>
  <meta name="description" content="Short games while you wait.">
  <meta name="color-scheme" content="light">
  <link rel="preload" href="{% static 'css/tokens.css' %}" as="style">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'gameshub/css/gameshub.css' %}">
  <style>
    /* Playfield palette. Server renders the default pack so the page is
       correct before any script runs; JS swaps in the stored preference. */
    :root {
      --gp-sky: {{ active_theme.sky }};
      --gp-far: {{ active_theme.far }};
      --gp-near: {{ active_theme.near }};
      --gp-ground: {{ active_theme.ground }};
      --gp-accent: {{ active_theme.accent }};
    }
  </style>
</head>

<body class="gh-body">
  <a class="skip-link" href="#gh-main">Skip to the games</a>

  <div class="gh-shell">
    <header class="gh-header">
      <a class="gh-brand" href="{% url 'gameshub:hub' %}">
        <span class="gh-brand-mark" aria-hidden="true"></span>
        <span class="gh-brand-name">Games Hub</span>
      </a>
      {% block exit %}{% endblock %}
    </header>

    <main id="gh-main" class="gh-main">
      {% block content %}{% endblock %}
    </main>

    <footer class="gh-footer">
      <p>Short games while you wait.</p>
    </footer>
  </div>

  {% block data %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>

</html>
