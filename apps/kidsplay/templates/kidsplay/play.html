{% extends "kidsplay/base.html" %}
{% load static %}
{% block title %}{{ game.title }}{% endblock %}
{% block content %}
<section class="kp-card kp-play">
  <header class="kp-hub-head">
    <div>
      <p class="kp-kicker">{{ kid.nickname }}</p>
      <h1>{{ game.title }}</h1>
    </div>
    <button class="kp-btn kp-btn--quiet" type="button" id="kp-mute">Sound on</button>
  </header>
  <div id="kp-game" data-slug="{{ game.slug }}" data-table="{{ table_code }}"></div>
  <p id="kp-status" role="status">Get ready…</p>
  <a class="kp-btn kp-btn--quiet" href="{% url 'kidsplay:hub' table_code %}">Back to games</a>
</section>
<script src="{% static 'kidsplay/js/game-runner.js' %}" type="module"></script>
{% endblock %}
