{% extends "kidsplay/base.html" %}
{% block title %}Confirm a reward{% endblock %}
{% block content %}
<form class="kp-card" method="post" action="{% url 'kidsplay_redeem_confirm' %}">
  {% csrf_token %}
  <h1>Confirm a reward</h1>
  <label for="code">6-digit code</label>
  <input id="code" name="code" inputmode="numeric" maxlength="6" required pattern="[0-9]{6}">
  <button class="kp-btn" type="submit">Confirm</button>
</form>
{% endblock %}
