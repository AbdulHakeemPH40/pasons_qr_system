{% extends "kidsplay/base.html" %}
{% block title %}Open visits{% endblock %}
{% block content %}
<section class="kp-card">
  <h1>Open visits</h1>
  {% for visit in visits %}
  <article class="kp-game">
    <h2>{{ visit.qr_code }}</h2>
    <p>{{ visit.family.phone }} · until {{ visit.expires_at|time }}</p>
  </article>
  {% empty %}
  <p>No open visits.</p>
  {% endfor %}
</section>
{% endblock %}
